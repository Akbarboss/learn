<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection</title>
<style>
  :root{ color-scheme: light dark;
    --bg:#EFF3F2; --ink:#0F1F1E; --ink2:#44605D; --line:#D7E1DF; --accent:#0D5156; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0A1514; --ink:#E4EDEB; --ink2:#9BB3B0; --line:#213432; --accent:#7FD5D5; }
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:system-ui,"Segoe UI",sans-serif;
    display:grid;place-items:center;padding:32px;text-align:center;
  }
  .card{max-width:34ch}
  svg{width:64px;height:64px;stroke:var(--accent);fill:none;stroke-width:1.6;
      stroke-linecap:round;margin-bottom:22px}
  h1{font-size:1.3rem;font-weight:600;margin:0 0 12px;line-height:1.3}
  p{margin:0 0 8px;color:var(--ink2);font-size:.97rem;line-height:1.5}
  p.ru{font-size:.9rem}
  button{
    margin-top:26px;font:inherit;font-size:.95rem;
    padding:11px 26px;border-radius:5px;cursor:pointer;
    background:var(--accent);color:var(--bg);border:none;
  }
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2 8.5a15 15 0 0 1 20 0"/>
      <path d="M5 12.5a10 10 0 0 1 14 0"/>
      <path d="M8.5 16.3a5 5 0 0 1 7 0"/>
      <circle cx="12" cy="20" r="0.6" fill="currentColor" stroke="none"/>
      <path d="M3 3l18 18" stroke-width="1.6"/>
    </svg>
    <h1>Internet kerak &mdash; faqat birinchi marta</h1>
    <p>Ilova darslarni bir marta yuklab oladi, keyin internetsiz ham ishlaydi.</p>
    <p class="ru">Интернет нужен только при первом запуске. Дальше приложение работает офлайн.</p>
    <button id="retry">Qayta urinish &nbsp;·&nbsp; Повторить</button>
  </div>

<script>
  var url = new URLSearchParams(location.search).get('u');
  document.getElementById('retry').addEventListener('click', function(){
    if (url) location.replace(url); else location.reload();
  });
</script>
</body>
</html>
